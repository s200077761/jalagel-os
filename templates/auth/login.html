{% extends "base.html" %}
{% block title %}Sign In - JALAGEL OS Pro{% endblock %}
{% block content %}
<section class="section" style="display:flex;align-items:center;justify-content:center;min-height:80vh;">
    <div class="container-narrow">
        <div class="card" style="max-width:420px;margin:0 auto;">
            <div class="text-center" style="margin-bottom:24px;">
                <div class="logo-icon" style="margin:0 auto 16px;width:48px;height:48px;font-size:1.5rem;">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <h2 style="margin-bottom:4px;">Welcome Back</h2>
                <p style="font-size:0.875rem;">Sign in to your JALAGEL OS Pro account</p>
            </div>
            <form method="POST" action="{{ url_for('auth_login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label class="form-label">Username or Email</label>
                    <input type="text" name="username" class="form-input" placeholder="Enter username or email" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="Enter password" required>
                </div>
                <div class="form-group" style="display:flex;align-items:center;justify-content:space-between;">
                    <label class="form-checkbox">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="#" style="font-size:0.8125rem;">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">
                    <i class="fa-solid fa-sign-in-alt"></i> Sign In
                </button>
            </form>
            <div class="divider"></div>
            <p class="text-center" style="font-size:0.875rem;">
                Don't have an account? <a href="{{ url_for('auth_register') }}">Get Started</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}

<div class="app-container" data-app="color-palette">
<style>
.cpg-wrap{display:flex;flex-direction:column;height:100%;padding:24px;overflow:auto;}
.cpg-input-row{display:flex;gap:12px;align-items:center;margin-bottom:24px;flex-wrap:wrap;}
.cpg-input-row input[type=color]{width:50px;height:50px;border:none;border-radius:12px;cursor:pointer;}
.cpg-input-row input[type=text]{padding:10px 14px;border:1px solid #334155;border-radius:8px;background:#1A1A2E;color:#F1F5F9;font-family:inherit;font-size:13px;outline:none;}
.cpg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;}
.cpg-card{background:#232344;border:1px solid #334155;border-radius:12px;overflow:hidden;transition:all .15s;}
.cpg-card:hover{border-color:rgba(124,58,237,0.3);transform:translateY(-2px);}
.cpg-color{height:100px;position:relative;cursor:pointer;}
.cpg-color .hex{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.5);padding:4px 8px;border-radius:4px;font-size:11px;font-family:'JetBrains Mono',monospace;color:#fff;}
.cpg-info{padding:12px;}
.cpg-info .name{font-size:12px;font-weight:600;color:#F1F5F9;}
.cpg-info .rgb{font-size:11px;color:#94A3B8;font-family:'JetBrains Mono',monospace;margin-top:2px;}
.cpg-actions{padding:8px 12px;display:flex;gap:6px;border-top:1px solid #334155;}
.cpg-actions button{padding:4px 8px;border:1px solid #334155;border-radius:4px;background:transparent;color:#94A3B8;font-size:11px;cursor:pointer;font-family:inherit;}
.cpg-actions button:hover{background:#7C3AED;color:#fff;border-color:#7C3AED;}
</style>
<div class="cpg-wrap">
<h2 style="margin:0 0 16px;"><i class="fa-solid fa-swatchbook" style="color:#EC4899;"></i> Color Palette Generator</h2>
<div class="cpg-input-row">
  <input type="color" id="cpgColor" value="#7C3AED" onchange="cpgGen()">
  <input type="text" id="cpgHex" value="#7C3AED" onchange="cpgFromHex()" style="font-family:'JetBrains Mono',monospace;">
  <button class="app-btn primary" onclick="cpgGen()">Generate</button>
  <button class="app-btn" onclick="cpgRandom()">Random</button>
  <button class="app-btn" onclick="cpgExport()">Export CSS</button>
</div>
<h3 style="font-size:14px;margin-bottom:12px;">Palette</h3>
<div class="cpg-grid" id="cpgGrid"></div>
<h3 style="font-size:14px;margin:24px 0 12px;">Harmonies</h3>
<div class="cpg-grid" id="cpgHarmony"></div>
</div>
<script>
(function(){
function hexToRgb(h){return{r:parseInt(h.slice(1,3),16),g:parseInt(h.slice(3,5),16),b:parseInt(h.slice(5,7),16)};}
function rgbToHex(r,g,b){return'#'+[r,g,b].map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,'0')).join('');}
function hslToHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h/30)%12;const c=l-a*Math.max(Math.min(k-3,9-k,1),-1);return Math.round(255*c).toString(16).padStart(2,'0');};return'#'+f(0)+f(8)+f(4);}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min)h=s=0;else{const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;}h/=6;}return{h:h*360,s:s*100,l:l*100};}
function genShades(hex){const rgb=hexToRgb(hex);return Array(5).fill(0).map((_,i)=>{const f=i/4;return rgbToHex(Math.round(255+(rgb.r-255)*f),Math.round(255+(rgb.g-255)*f),Math.round(255+(rgb.b-255)*f));});}
function genTints(hex){const rgb=hexToRgb(hex);return Array(5).fill(0).map((_,i)=>{const f=i/4;return rgbToHex(Math.round(rgb.r+(255-rgb.r)*f),Math.round(rgb.g+(255-rgb.g)*f),Math.round(rgb.b+(255-rgb.b)*f));});}
function genHarmonies(hex){const hsl=rgbToHsl(hexToRgb(hex).r,hexToRgb(hex).g,hexToRgb(hex).b);return[
  {name:'Complementary',colors:[hex,hslToHex((hsl.h+180)%360,hsl.s,hsl.l)]},
  {name:'Analogous',colors:[hslToHex((hsl.h-30+360)%360,hsl.s,hsl.l),hex,hslToHex((hsl.h+30)%360,hsl.s,hsl.l)]},
  {name:'Triadic',colors:[hex,hslToHex((hsl.h+120)%360,hsl.s,hsl.l),hslToHex((hsl.h+240)%360,hsl.s,hsl.l)]},
  {name:'Split Complementary',colors:[hex,hslToHex((hsl.h+150)%360,hsl.s,hsl.l),hslToHex((hsl.h+210)%360,hsl.s,hsl.l)]},
];}
function createCard(hex,name){const rgb=hexToRgb(hex);const d=document.createElement('div');d.className='cpg-card';d.innerHTML='<div class="cpg-color" style="background:'+hex+';" onclick="cpgCopy(''+hex+'')"><span class="hex">'+hex+'</span></div><div class="cpg-info"><div class="name">'+(name||'')+'</div><div class="rgb">rgb('+rgb.r+','+rgb.g+','+rgb.b+')</div></div><div class="cpg-actions"><button onclick="cpgCopy(''+hex+'')">Copy</button><button onclick="cpgSet(''+hex+'')">Use</button></div>';return d;}
window.cpgGen=function(){const hex=document.getElementById('cpgColor').value;document.getElementById('cpgHex').value=hex;const g=document.getElementById('cpgGrid');g.innerHTML='';
  genShades(hex).forEach((c,i)=>g.appendChild(createCard(c,'Shade '+(i+1))));genTints(hex).forEach((c,i)=>g.appendChild(createCard(c,'Tint '+(i+1))));
  const h=genHarmonies(hex);const hg=document.getElementById('cpgHarmony');hg.innerHTML='';
  h.forEach(ha=>{const d=document.createElement('div');d.className='cpg-card';d.innerHTML='<div style="display:flex;height:60px;">'+ha.colors.map(c=>'<div style="flex:1;background:'+c+';cursor:pointer;" onclick="cpgCopy(''+c+'')" title="'+c+'"></div>').join('')+'</div><div class="cpg-info"><div class="name">'+ha.name+'</div></div>';hg.appendChild(d);});
};
window.cpgFromHex=function(){const v=document.getElementById('cpgHex').value;if(/^#[0-9A-Fa-f]{6}$/.test(v)){document.getElementById('cpgColor').value=v;cpgGen();}};
window.cpgRandom=function(){const hex='#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');document.getElementById('cpgColor').value=hex;document.getElementById('cpgHex').value=hex;cpgGen();};
window.cpgCopy=function(hex){JALAGEL.Utils.copyToClipboard(hex);JALAGEL.Utils.toast('Copied '+hex,'success');};
window.cpgSet=function(hex){document.getElementById('cpgColor').value=hex;document.getElementById('cpgHex').value=hex;cpgGen();};
window.cpgExport=function(){let css=':root {\n';document.querySelectorAll('.cpg-card .cpg-color .hex').forEach((el,i)=>{css+='  --color-'+(i+1)+': '+el.textContent+';\n';});css+='}';JALAGEL.Utils.downloadText(css,'palette.css','text/css');JALAGEL.Utils.toast('CSS exported','success');};
cpgGen();
})();
</script>
</div>

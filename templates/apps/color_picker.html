<div class="app-container" data-app="color-picker">
<style>
.cp-wrap{display:flex;height:100%;padding:24px;gap:24px;overflow:auto;}
.cp-main{flex:1;display:flex;flex-direction:column;gap:16px;}
.cp-preview{height:120px;border-radius:12px;border:1px solid #334155;transition:background .2s;}
.cp-wheel-wrap{display:flex;align-items:center;justify-content:center;padding:24px;}
.cp-wheel{width:250px;height:250px;border-radius:50%;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;cursor:crosshair;box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.cp-wheel::after{content:'';position:absolute;inset:20px;border-radius:50%;background:#232344;}
.cp-values{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.cp-val{display:flex;flex-direction:column;gap:4px;}
.cp-val label{font-size:11px;color:#94A3B8;text-transform:uppercase;}
.cp-val input{padding:8px 12px;border:1px solid #334155;border-radius:8px;background:#1A1A2E;color:#F1F5F9;font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;}
.cp-palette{display:flex;gap:8px;flex-wrap:wrap;}
.cp-swatch{width:40px;height:40px;border-radius:8px;border:2px solid #334155;cursor:pointer;transition:transform .15s;}
.cp-swatch:hover{transform:scale(1.15);border-color:#F1F5F9;}
.cp-sidebar{width:220px;border-left:1px solid #334155;padding-left:24px;}
.cp-sidebar h4{margin:0 0 12px;font-size:13px;color:#7C3AED;}
</style>
<div class="cp-wrap">
<div class="cp-main">
  <h2 style="margin:0;"><i class="fa-solid fa-eye-dropper" style="color:#7C3AED;"></i> Color Picker</h2>
  <div class="cp-preview" id="cpPreview" style="background:#7C3AED;"></div>
  <div class="cp-wheel-wrap"><div class="cp-wheel" id="cpWheel" onclick="cpPick(event)"></div></div>
  <div class="cp-values">
    <div class="cp-val"><label>Hex</label><input type="text" id="cpHex" value="#7C3AED" oninput="cpFromHex()"></div>
    <div class="cp-val"><label>RGB</label><input type="text" id="cpRgb" value="124, 58, 237" oninput="cpFromRgb()"></div>
    <div class="cp-val"><label>HSL</label><input type="text" id="cpHsl" value="262, 83%, 58%" oninput="cpFromHsl()"></div>
  </div>
  <div><label style="font-size:11px;color:#94A3B8;margin-bottom:8px;display:block;">Generated Palette</label><div class="cp-palette" id="cpPalette"></div></div>
</div>
<div class="cp-sidebar">
  <h4>Recent Colors</h4>
  <div class="cp-palette" id="cpRecent"></div>
  <h4 style="margin-top:24px;">Shades</h4>
  <div class="cp-palette" id="cpShades"></div>
  <button class="app-btn primary" onclick="cpCopy()" style="width:100%;margin-top:24px;"><i class="fa-solid fa-copy"></i> Copy Hex</button>
</div>
</div>
<script>
(function(){
let curHex='#7C3AED',recent=[];
function update(hex){curHex=hex;const rgb=hexToRgb(hex),hsl=rgbToHsl(rgb.r,rgb.g,rgb.b);
  document.getElementById('cpPreview').style.background=hex;document.getElementById('cpHex').value=hex;
  document.getElementById('cpRgb').value=rgb.r+', '+rgb.g+', '+rgb.b;
  document.getElementById('cpHsl').value=Math.round(hsl.h)+', '+Math.round(hsl.s)+'%, '+Math.round(hsl.l)+'%';
  genPalette(hex);genShades(hex);
}
function genPalette(hex){const p=document.getElementById('cpPalette');p.innerHTML='';for(let i=0;i<8;i++){const h=(parseInt(hex.slice(1),16)+i*0x1F4F3D)%0xFFFFFF;const c='#'+Math.abs(h).toString(16).padStart(6,'0');const s=document.createElement('div');s.className='cp-swatch';s.style.background=c;s.onclick=()=>update(c);p.appendChild(s);}}
function genShades(hex){const p=document.getElementById('cpShades');p.innerHTML='';const rgb=hexToRgb(hex);for(let i=0;i<5;i++){const f=i/4;const r=Math.round(255+(rgb.r-255)*f),g=Math.round(255+(rgb.g-255)*f),b=Math.round(255+(rgb.b-255)*f);const c='#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');const s=document.createElement('div');s.className='cp-swatch';s.style.background=c;s.onclick=()=>update(c);p.appendChild(s);}}
function hexToRgb(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return{r,g,b};}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;if(max===min){h=s=0;}else{const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}return{h:h*360,s:s*100,l:l*100};}
window.cpPick=function(e){const r=e.target.getBoundingClientRect();const x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const angle=Math.atan2(y,x)*180/Math.PI+180;const dist=Math.min(Math.sqrt(x*x+y*y),r.width/2-20)/(r.width/2-20);const hex=JALAGEL.Utils.hslToHex(angle,dist*100,50);update(hex);addRecent(hex);};
window.cpFromHex=function(){const v=document.getElementById('cpHex').value;if(/^#[0-9A-Fa-f]{6}$/.test(v))update(v);};
window.cpFromRgb=function(){const v=document.getElementById('cpRgb').value.split(',').map(x=>parseInt(x.trim()));if(v.length===3){const hex='#'+v.map(x=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,'0')).join('');update(hex);}};
window.cpFromHsl=function(){const v=document.getElementById('cpHsl').value.match(/(\d+),\s*(\d+)%,\s*(\d+)%/);if(v){const hex=JALAGEL.Utils.hslToHex(parseInt(v[1]),parseInt(v[2]),parseInt(v[3]));update(hex);}};
window.cpCopy=function(){JALAGEL.Utils.copyToClipboard(curHex);JALAGEL.Utils.toast('Copied '+curHex,'success');};
function addRecent(hex){if(!recent.includes(hex))recent.unshift(hex);if(recent.length>8)recent.pop();const p=document.getElementById('cpRecent');p.innerHTML='';recent.forEach(c=>{const s=document.createElement('div');s.className='cp-swatch';s.style.background=c;s.onclick=()=>update(c);p.appendChild(s);});}
update('#7C3AED');
})();
</script>
</div>

<div class="app-container" data-app="password-manager">
<style>
.pm-wrap{display:flex;height:100%;}
.pm-sidebar{width:280px;border-right:1px solid #334155;background:#232344;display:flex;flex-direction:column;flex-shrink:0;}
.pm-header{padding:12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #334155;}
.pm-search{padding:8px 12px;border-bottom:1px solid #334155;}
.pm-search input{width:100%;padding:8px 12px;border:1px solid #334155;border-radius:8px;background:#1A1A2E;color:#F1F5F9;font-size:13px;outline:none;font-family:inherit;}
.pm-list{flex:1;overflow:auto;}
.pm-item{padding:10px 12px;border-bottom:1px solid rgba(51,65,85,0.3);cursor:pointer;transition:all .15s;}
.pm-item:hover,.pm-item.active{background:rgba(124,58,237,0.1);}
.pm-item-name{font-size:13px;font-weight:600;color:#F1F5F9;display:flex;align-items:center;gap:8px;}
.pm-item-user{font-size:11px;color:#94A3B8;margin-top:2px;}
.pm-main{flex:1;padding:24px;overflow:auto;}
.pm-card{max-width:500px;margin:0 auto;background:#232344;border:1px solid #334155;border-radius:16px;padding:32px;}
.pm-field{display:flex;flex-direction:column;gap:4px;margin-bottom:16px;}
.pm-field label{font-size:11px;color:#94A3B8;text-transform:uppercase;letter-spacing:0.05em;}
.pm-field input{padding:10px 12px;border:1px solid #334155;border-radius:8px;background:#1A1A2E;color:#F1F5F9;font-family:inherit;font-size:13px;outline:none;}
.pm-pw-row{display:flex;gap:8px;}
.pm-pw-row button{padding:10px 12px;border:1px solid #334155;border-radius:8px;background:#1A1A2E;color:#F1F5F9;cursor:pointer;font-size:12px;}
.pm-pw-row button:hover{background:#7C3AED;border-color:#7C3AED;}
.pm-strength{height:4px;background:#334155;border-radius:2px;margin-top:8px;overflow:hidden;}
.pm-strength-bar{height:100%;border-radius:2px;transition:all .3s;width:0;}
.pm-gen{padding:16px;background:#1A1A2E;border:1px solid #334155;border-radius:12px;margin-top:16px;}
.pm-gen h4{margin:0 0 12px;}
.pm-check{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.pm-check label{display:flex;align-items:center;gap:4px;font-size:12px;color:#94A3B8;cursor:pointer;}
</style>
<div class="pm-wrap">
<div class="pm-sidebar">
  <div class="pm-header"><h3 style="margin:0;font-size:14px;">Password Vault</h3><button class="app-btn primary sm" onclick="pmNew()"><i class="fa-solid fa-plus"></i></button></div>
  <div class="pm-search"><input type="text" placeholder="Search passwords..." oninput="pmFilter(this.value)"></div>
  <div class="pm-list" id="pmList"></div>
</div>
<div class="pm-main" id="pmMain">
  <div class="pm-card">
    <div style="text-align:center;margin-bottom:24px;"><i class="fa-solid fa-key" style="font-size:2.5rem;color:#7C3AED;"></i><h2 style="margin:8px 0 4px;" id="pmTitle">New Entry</h2></div>
    <div class="pm-field"><label>Website/Service</label><input type="text" id="pmSite" placeholder="e.g., google.com"></div>
    <div class="pm-field"><label>Username</label><input type="text" id="pmUser" placeholder="username"></div>
    <div class="pm-field"><label>Password</label><div class="pm-pw-row"><input type="text" id="pmPass" placeholder="password" style="flex:1;" oninput="pmCheckStrength()"><button onclick="pmGen()"><i class="fa-solid fa-shuffle"></i> Generate</button><button onclick="pmCopy()"><i class="fa-solid fa-copy"></i></button></div><div class="pm-strength"><div class="pm-strength-bar" id="pmStrBar"></div></div></div>
    <div class="pm-field"><label>Notes</label><input type="text" id="pmNotes" placeholder="Optional notes..."></div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:16px;">
      <button class="app-btn primary" onclick="pmSave()"><i class="fa-solid fa-floppy-disk"></i> Save</button>
      <button class="app-btn danger" onclick="pmDelete()"><i class="fa-solid fa-trash"></i> Delete</button>
    </div>
    <div class="pm-gen">
      <h4><i class="fa-solid fa-shield-halved" style="color:#10B981;"></i> Password Generator</h4>
      <div class="pm-check">
        <label><input type="checkbox" id="pmUpper" checked> A-Z</label>
        <label><input type="checkbox" id="pmLower" checked> a-z</label>
        <label><input type="checkbox" id="pmNums" checked> 0-9</label>
        <label><input type="checkbox" id="pmSymbols" checked> !@#$</label>
      </div>
      <label style="font-size:11px;color:#94A3B8;">Length: <span id="pmLenVal">16</span></label>
      <input type="range" id="pmLen" value="16" min="6" max="64" style="width:100%;" oninput="document.getElementById('pmLenVal').textContent=this.value">
      <button class="app-btn primary" onclick="pmGen()" style="width:100%;margin-top:8px;"><i class="fa-solid fa-rotate"></i> Generate Strong Password</button>
    </div>
  </div>
</div>
</div>
<script>
(function(){
let items=JALAGEL.Storage.get('passwords','items',[{id:1,site:'Google',user:'admin',pass:'********',notes:'Main account'},{id:2,site:'GitHub',user:'developer',pass:'********',notes:'Work repo'},{id:3,site:'AWS Console',user:'ops',pass:'********',notes:'Production'}]),activeId=null;
function render(){const l=document.getElementById('pmList');l.innerHTML='';const q=(document.querySelector('.pm-search input').value||'').toLowerCase();
  items.filter(i=>i.site.toLowerCase().includes(q)||i.user.toLowerCase().includes(q)).forEach(it=>{const d=document.createElement('div');d.className='pm-item'+(it.id===activeId?' active':'');
    d.innerHTML='<div class="pm-item-name"><i class="fa-solid fa-globe" style="color:#7C3AED;"></i> '+it.site+'</div><div class="pm-item-user">'+it.user+'</div>';d.onclick=()=>{activeId=it.id;render();loadDetail();};l.appendChild(d);});
}
function loadDetail(){const it=items.find(x=>x.id===activeId);if(it){document.getElementById('pmSite').value=it.site;document.getElementById('pmUser').value=it.user;document.getElementById('pmPass').value=it.pass;document.getElementById('pmNotes').value=it.notes||'';document.getElementById('pmTitle').textContent=it.site;pmCheckStrength();}else{document.getElementById('pmSite').value='';document.getElementById('pmUser').value='';document.getElementById('pmPass').value='';document.getElementById('pmNotes').value='';document.getElementById('pmTitle').textContent='New Entry';}}
window.pmNew=function(){activeId=null;loadDetail();render();};
window.pmSave=function(){const site=document.getElementById('pmSite').value,user=document.getElementById('pmUser').value,pass=document.getElementById('pmPass').value,notes=document.getElementById('pmNotes').value;if(!site||!pass)return;
  if(activeId){const it=items.find(x=>x.id===activeId);it.site=site;it.user=user;it.pass=pass;it.notes=notes;}else{items.push({id:Date.now(),site,user,pass,notes});activeId=items[items.length-1].id;}
  JALAGEL.Storage.set('passwords','items',items);render();loadDetail();JALAGEL.Utils.toast('Saved','success');
};
window.pmDelete=function(){if(!activeId||!confirm('Delete?'))return;items=items.filter(x=>x.id!==activeId);activeId=null;JALAGEL.Storage.set('passwords','items',items);render();loadDetail();};
window.pmFilter=function(q){render();};
window.pmGen=function(){
  const len=parseInt(document.getElementById('pmLen').value);const u=document.getElementById('pmUpper').checked,l=document.getElementById('pmLower').checked,n=document.getElementById('pmNums').checked,s=document.getElementById('pmSymbols').checked;
  let chars='';if(u)chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(l)chars+='abcdefghijklmnopqrstuvwxyz';if(n)chars+='0123456789';if(s)chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
  if(!chars)chars='abcdefghijklmnopqrstuvwxyz';
  let pw='';for(let i=0;i<len;i++)pw+=chars.charAt(Math.floor(Math.random()*chars.length));
  document.getElementById('pmPass').value=pw;pmCheckStrength();
};
window.pmCopy=function(){const p=document.getElementById('pmPass').value;if(p){JALAGEL.Utils.copyToClipboard(p);JALAGEL.Utils.toast('Copied!','success');}};
window.pmCheckStrength=function(){
  const p=document.getElementById('pmPass').value;let s=0;if(p.length>=8)s+=20;if(p.length>=16)s+=20;if(/[A-Z]/.test(p))s+=15;if(/[a-z]/.test(p))s+=15;if(/[0-9]/.test(p))s+=15;if(/[^A-Za-z0-9]/.test(p))s+=15;
  const bar=document.getElementById('pmStrBar');bar.style.width=s+'%';bar.style.background=s<40?'#EF4444':s<70?'#F59E0B':'#10B981';
};
render();loadDetail();
})();
</script>
</div>

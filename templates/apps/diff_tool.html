<div class="app-container" data-app="diff-tool">
<style>
.df-wrap{display:flex;flex-direction:column;height:100%;padding:24px;overflow:auto;}
.df-toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.df-panels{display:flex;gap:16px;flex:1;min-height:200px;}
.df-panel{flex:1;display:flex;flex-direction:column;background:#232344;border:1px solid #334155;border-radius:12px;overflow:hidden;}
.df-header{padding:8px 12px;background:#1A1A2E;border-bottom:1px solid #334155;font-size:12px;font-weight:600;color:#94A3B8;}
.df-textarea{flex:1;padding:12px;background:#0f0f23;color:#F1F5F9;font-family:'JetBrains Mono',monospace;font-size:13px;border:none;outline:none;resize:none;line-height:1.6;}
.df-result{margin-top:16px;padding:16px;background:#232344;border:1px solid #334155;border-radius:12px;max-height:250px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.8;}
.df-line{padding:2px 8px;border-radius:4px;}
.df-same{background:transparent;}.df-add{background:rgba(16,185,129,0.15);color:#34D399;}.df-del{background:rgba(239,68,68,0.15);color:#F87171;}.df-mod{background:rgba(245,158,11,0.15);color:#FBBF24;}
</style>
<div class="df-wrap">
<h2 style="margin:0 0 16px;"><i class="fa-solid fa-code-compare" style="color:#06B6D4;"></i> Diff Tool</h2>
<div class="df-toolbar">
  <button class="app-btn primary" onclick="dfCompare()">Compare</button>
  <button class="app-btn" onclick="dfClear()">Clear</button>
  <label style="font-size:12px;color:#94A3B8;display:flex;align-items:center;gap:4px;"><input type="checkbox" id="dfIgnore" checked> Ignore whitespace</label>
</div>
<div class="df-panels">
  <div class="df-panel">
    <div class="df-header">Original Text</div>
    <textarea class="df-textarea" id="dfLeft" spellcheck="false">function hello() {
  console.log("Hello World");
  return true;
}</textarea>
  </div>
  <div class="df-panel">
    <div class="df-header">Modified Text</div>
    <textarea class="df-textarea" id="dfRight" spellcheck="false">function hello(name) {
  console.log("Hello, " + name);
  return "greeting sent";
}</textarea>
  </div>
</div>
<h4 style="margin:16px 0 8px;font-size:13px;color:#94A3B8;">Diff Result</h4>
<div class="df-result" id="dfResult"></div>
</div>
<script>
(function(){
function lcs(a,b){const m=a.length,n=b.length;const dp=Array(m+1).fill(null).map(()=>Array(n+1).fill(0));for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)if(a[i-1]===b[j-1])dp[i][j]=dp[i-1][j-1]+1;else dp[i][j]=Math.max(dp[i-1][j],dp[i][j-1]);const result=[];let i=m,j=n;while(i>0&&j>0){if(a[i-1]===b[j-1]){result.unshift({type:'same',line:a[i-1]});i--;j--;}else if(dp[i-1][j]>dp[i][j-1]){result.unshift({type:'del',line:a[i-1]});i--;}else{result.unshift({type:'add',line:b[j-1]});j--;}}while(i>0){result.unshift({type:'del',line:a[i-1]});i--;}while(j>0){result.unshift({type:'add',line:b[j-1]});j--;}return result;}
window.dfCompare=function(){const left=document.getElementById('dfLeft').value.split('\n');const right=document.getElementById('dfRight').value.split('\n');const diff=lcs(left,right);const r=document.getElementById('dfResult');r.innerHTML='';
  diff.forEach(d=>{const el=document.createElement('div');el.className='df-line df-'+d.type;el.textContent=(d.type==='add'?'+ ':d.type==='del'?'- ':'  ')+d.line;r.appendChild(el);});
};
window.dfClear=function(){document.getElementById('dfLeft').value='';document.getElementById('dfRight').value='';document.getElementById('dfResult').innerHTML='';};
dfCompare();
})();
</script>
</div>
